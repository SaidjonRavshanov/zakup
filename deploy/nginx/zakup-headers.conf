# /etc/nginx/snippets/zakup-headers.conf
# X-Frame-Options DENY emas: Telegram Web (web.telegram.org) Mini App'ni iframe'da ochadi
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
