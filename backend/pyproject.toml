[project]
name = "zakup"
version = "0.1.0"
description = "Xarid va ombor tizimi (iiko integratsiyasi) — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.0",
    "ruff>=0.16",
    "mypy>=2.4",
    "import-linter>=2.15",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PT", "ASYNC", "S", "RUF", "PL", "TID"]
ignore = ["PLR0913", "S101"]

[tool.ruff.lint.isort]
# backend/alembic papkasi bor — ruff uni first-party deb o'ylamasin
known-third-party = ["alembic"]
known-first-party = ["zakup", "tests"]

[tool.ruff.lint.per-file-ignores]
# Ikki tilli matnlar: kirill harflari ataylab ishlatilgan
"src/zakup/platform/i18n.py" = ["RUF001"]
# iiko ma'lumotidagi kirill birlik nomlari / belgilari ataylab
"src/zakup/modules/integration_iiko/domain/mapping.py" = ["RUF001"]
# Yetkazuvchiga ruscha xabar shabloni
"src/zakup/modules/procurement/application/message.py" = ["RUF001"]
"tests/**" = ["PLR2004", "S105", "S106", "RUF001", "RUF003"]
"alembic/**" = ["N999"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["zakup"]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: haqiqiy PostgreSQL kerak"]

# ---------------------------------------------------------------- import-linter
# Arxitektura chegaralari (docs/ARCHITECTURE.md §3.1, §4) — buzilsa CI yiqiladi.
[tool.importlinter]
root_package = "zakup"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain va shared_kernel hech qanday framework'ni bilmaydi"
type = "forbidden"
source_modules = ["zakup.shared_kernel", "zakup.modules.*.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic", "asyncpg", "zakup.platform"]

[[tool.importlinter.contracts]]
name = "Modul ichidagi qatlamlar: (api | infrastructure) -> application -> domain"
type = "layers"
containers = [
    "zakup.modules.catalog",
    "zakup.modules.finance",
    "zakup.modules.identity",
    "zakup.modules.integration_iiko",
    "zakup.modules.planning",
    "zakup.modules.procurement",
    "zakup.modules.receiving",
]
# api va infrastructure bir-birini bilmaydi: ular bootstrap.py (composition root) da ulanadi
layers = ["api | infrastructure", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Application qatlami infrastructure'ni import qilmaydi (DIP)"
type = "forbidden"
source_modules = ["zakup.modules.*.application"]
forbidden_modules = ["zakup.modules.*.infrastructure", "zakup.modules.*.api", "fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Modullar bir-birining faqat application qatlamini chaqiradi (ARCHITECTURE §3.1)"
type = "forbidden"
source_modules = [
    "zakup.modules.finance",
    "zakup.modules.integration_iiko",
    "zakup.modules.procurement",
    "zakup.modules.receiving",
]
forbidden_modules = [
    "zakup.modules.catalog.domain",
    "zakup.modules.catalog.infrastructure",
    "zakup.modules.catalog.api",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "receiving / integration_iiko boshqa modullarning faqat application qatlamini chaqiradi"
type = "forbidden"
source_modules = ["zakup.modules.receiving", "zakup.modules.integration_iiko"]
forbidden_modules = [
    "zakup.modules.procurement.domain",
    "zakup.modules.procurement.infrastructure",
    "zakup.modules.procurement.api",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "integration_iiko receiving'ning faqat application qatlamini chaqiradi"
type = "forbidden"
source_modules = ["zakup.modules.integration_iiko"]
forbidden_modules = ["zakup.modules.receiving.domain", "zakup.modules.receiving.infrastructure", "zakup.modules.receiving.api"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "finance boshqa modullarni faqat event va catalog facade orqali biladi"
type = "forbidden"
source_modules = ["zakup.modules.finance"]
forbidden_modules = ["zakup.modules.procurement", "zakup.modules.receiving", "zakup.modules.integration_iiko"]

[[tool.importlinter.contracts]]
name = "Hech bir modul finance'ni import qilmaydi (procurement'ga facade bootstrap'da ulanadi)"
type = "forbidden"
source_modules = ["zakup.modules.procurement", "zakup.modules.receiving", "zakup.modules.integration_iiko"]
forbidden_modules = ["zakup.modules.finance"]

[[tool.importlinter.contracts]]
name = "planning faqat o'z ma'lumotini biladi; boshqalar uni faqat application facade orqali chaqiradi"
type = "forbidden"
source_modules = ["zakup.modules.planning"]
forbidden_modules = [
    "zakup.modules.catalog",
    "zakup.modules.finance",
    "zakup.modules.integration_iiko",
    "zakup.modules.procurement",
    "zakup.modules.receiving",
]

[[tool.importlinter.contracts]]
name = "planning'ning ichki qatlamlari boshqa modullarga yopiq"
type = "forbidden"
source_modules = ["zakup.modules.integration_iiko", "zakup.modules.procurement"]
forbidden_modules = ["zakup.modules.planning.domain", "zakup.modules.planning.infrastructure"]
allow_indirect_imports = true
