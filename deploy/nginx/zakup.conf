# /etc/nginx/sites-available/zakup.absvision.ai
# Cloudflare orqasida: haqiqiy IP — conf.d/cloudflare-realip.conf; limitlar — conf.d/ratelimit.conf.
# Sertifikat — certbot (Let's Encrypt), avtomatik yangilanadi.
# DIQQAT: location ichidagi add_header server darajasidagilarni bekor qiladi — shuning uchun
# xavfsizlik sarlavhalari snippets/zakup-headers.conf da va har joyda include qilinadi.

server {
    listen 80;
    listen [::]:80;
    server_name zakup.absvision.ai;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    http2 on;
    server_name zakup.absvision.ai;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/zakup.absvision.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zakup.absvision.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/zakup/frontend;
    index index.html;
    client_max_body_size 25m;   # nakladnoy fotosi / to'lov isboti

    include /etc/nginx/snippets/zakup-headers.conf;

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params_custom;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params_custom;
    }

    # Vite build: nomida hash bor — uzoq kesh
    location /assets/ {
        include /etc/nginx/snippets/zakup-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA (shu jumladan yetkazuvchi havolasi /s/{token}) — index.html keshlanmaydi
    location / {
        include /etc/nginx/snippets/zakup-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
