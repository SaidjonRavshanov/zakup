# /etc/nginx/sites-available/zakup.absvision.ai — TLS qatorlarini certbot qo'shadi (--redirect).
# Cloudflare orqasida: haqiqiy IP — conf.d/cloudflare-realip.conf; limitlar — conf.d/ratelimit.conf.

server {
    listen 80;
    listen [::]:80;
    server_name zakup.absvision.ai;
    server_tokens off;

    root /srv/zakup/frontend;
    index index.html;

    # --- Security headers ---
    # X-Frame-Options DENY emas: Telegram Web (web.telegram.org) Mini App'ni iframe'da ochadi
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;   # nakladnoy fotosi / to'lov isboti

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params_custom;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params_custom;
    }

    # Vite build: nomida hash bor — uzoq kesh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA (shu jumladan yetkazuvchi havolasi /s/{token}) — index.html keshlanmaydi
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;
    }
}
